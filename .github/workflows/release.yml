name: Release
on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y zsh strace
      - run: python3 scripts/diagnose_completion.py
      - run: make check
      - name: Check ownership changes after warming
        run: sudo python3 tests/test_runtime.py RuntimeTests.test_changed_completion_file_ownership_invalidates_cache
      - name: Package the exact tag
        run: |
          version=$(cat VERSION)
          test "$GITHUB_REF_NAME" = "v$version"
          mkdir -p artifacts
          git archive --format=tar --prefix="zshard-$version/" HEAD | gzip -n > "artifacts/zshard-$version.tar.gz"
          cd artifacts
          sha256sum "zshard-$version.tar.gz" > SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" artifacts/* --clobber
